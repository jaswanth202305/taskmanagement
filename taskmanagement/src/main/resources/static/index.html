<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Flow — Premium Task Management</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.7);
            --bg-card-hover: rgba(51, 65, 85, 0.8);
            --accent-purple: #8b5cf6;
            --accent-blue: #3b82f6;
            --accent-pink: #ec4899;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);

            --status-pending: #f59e0b;
            --status-progress: #3b82f6;
            --status-completed: #10b981;
            --status-cancelled: #ef4444;

            --priority-low: #10b981;
            --priority-medium: #f59e0b;
            --priority-high: #f97316;
            --priority-urgent: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.15) 0px, transparent 50%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-icon {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            box-shadow: 0 8px 20px rgba(139, 92, 246, 0.3);
        }

        .logo-text h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-text p {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
            color: #fff;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.5);
        }

        /* Stats Section */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.25rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            padding: 1.25rem;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: transform 0.2s ease;
        }

        .stat-card:hover {
            transform: translateY(-3px);
        }

        .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
        }

        .stat-info h3 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .stat-info p {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* Filter Controls */
        .controls-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            padding: 1.25rem;
            border-radius: 16px;
            margin-bottom: 2rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            border-radius: 10px;
            color: var(--text-primary);
            outline: none;
        }

        .search-box i {
            position: absolute;
            left: 0.9rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }

        .filter-select {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            padding: 0.75rem 1rem;
            border-radius: 10px;
            color: var(--text-primary);
            outline: none;
            cursor: pointer;
        }

        .filter-select option {
            background: #1e293b;
            color: #fff;
        }

        /* Task Cards Grid */
        .task-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 1.5rem;
        }

        .task-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        .task-card:hover {
            background: var(--bg-card-hover);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.75rem;
            gap: 0.5rem;
        }

        .task-title {
            font-size: 1.15rem;
            font-weight: 600;
            line-height: 1.4;
        }

        .badge {
            padding: 0.25rem 0.6rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-pending { background: rgba(245, 158, 11, 0.15); color: var(--status-pending); border: 1px solid rgba(245, 158, 11, 0.3); }
        .badge-in_progress { background: rgba(59, 130, 246, 0.15); color: var(--status-progress); border: 1px solid rgba(59, 130, 246, 0.3); }
        .badge-completed { background: rgba(16, 185, 129, 0.15); color: var(--status-completed); border: 1px solid rgba(16, 185, 129, 0.3); }
        .badge-cancelled { background: rgba(239, 68, 68, 0.15); color: var(--status-cancelled); border: 1px solid rgba(239, 68, 68, 0.3); }

        .priority-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 0.4rem;
        }

        .task-desc {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 1.25rem;
            line-height: 1.5;
            flex-grow: 1;
        }

        .task-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-secondary);
            border-top: 1px solid var(--border-color);
            padding-top: 0.85rem;
            margin-top: 0.5rem;
        }

        .task-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn-icon {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-icon:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        .btn-icon.delete:hover {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border-color: rgba(239, 68, 68, 0.4);
        }

        /* Modal */
        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }

        .modal-backdrop.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal {
            background: #1e293b;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            width: 90%;
            max-width: 500px;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            transform: scale(0.95);
            transition: transform 0.3s ease;
        }

        .modal-backdrop.active .modal {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 0.4rem;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--border-color);
            padding: 0.75rem 1rem;
            border-radius: 10px;
            color: var(--text-primary);
            outline: none;
        }

        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            border-color: var(--accent-purple);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
            margin-top: 1.5rem;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.75rem 1.25rem;
            border-radius: 10px;
            cursor: pointer;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 1rem;
            grid-column: 1 / -1;
            color: var(--text-secondary);
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: var(--accent-purple);
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header>
            <div class="logo-area">
                <div class="logo-icon">
                    <i class="fa-solid fa-list-check"></i>
                </div>
                <div class="logo-text">
                    <h1>TaskFlow</h1>
                    <p>Spring Boot Task Management Dashboard</p>
                </div>
            </div>
            <button class="btn-primary" onclick="openModal()">
                <i class="fa-solid fa-plus"></i> New Task
            </button>
        </header>

        <!-- Stats Overview -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(139, 92, 246, 0.2); color: var(--accent-purple);">
                    <i class="fa-solid fa-tasks"></i>
                </div>
                <div class="stat-info">
                    <h3 id="stat-total">0</h3>
                    <p>Total Tasks</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(245, 158, 11, 0.2); color: var(--status-pending);">
                    <i class="fa-solid fa-clock"></i>
                </div>
                <div class="stat-info">
                    <h3 id="stat-pending">0</h3>
                    <p>Pending</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(59, 130, 246, 0.2); color: var(--status-progress);">
                    <i class="fa-solid fa-spinner"></i>
                </div>
                <div class="stat-info">
                    <h3 id="stat-progress">0</h3>
                    <p>In Progress</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(16, 185, 129, 0.2); color: var(--status-completed);">
                    <i class="fa-solid fa-circle-check"></i>
                </div>
                <div class="stat-info">
                    <h3 id="stat-completed">0</h3>
                    <p>Completed</p>
                </div>
            </div>
        </div>

        <!-- Controls / Filters -->
        <div class="controls-card">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search-input" placeholder="Search tasks by title or description..." oninput="fetchTasks()">
            </div>
            <select id="status-filter" class="filter-select" onchange="fetchTasks()">
                <option value="">All Statuses</option>
                <option value="PENDING">Pending</option>
                <option value="IN_PROGRESS">In Progress</option>
                <option value="COMPLETED">Completed</option>
                <option value="CANCELLED">Cancelled</option>
            </select>
            <select id="priority-filter" class="filter-select" onchange="fetchTasks()">
                <option value="">All Priorities</option>
                <option value="LOW">Low Priority</option>
                <option value="MEDIUM">Medium Priority</option>
                <option value="HIGH">High Priority</option>
                <option value="URGENT">Urgent</option>
            </select>
        </div>

        <!-- Task List Grid -->
        <div class="task-grid" id="task-container">
            <!-- Dynamic task cards inserted via JS -->
        </div>
    </div>

    <!-- Modal for Task Create / Edit -->
    <div class="modal-backdrop" id="modal-backdrop">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modal-title">Create New Task</h2>
                <button class="btn-icon" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="task-form" onsubmit="handleFormSubmit(event)">
                <input type="hidden" id="task-id">
                
                <div class="form-group">
                    <label for="task-title-input">Task Title *</label>
                    <input type="text" id="task-title-input" required placeholder="e.g. Complete REST API Integration">
                </div>

                <div class="form-group">
                    <label for="task-desc-input">Description</label>
                    <textarea id="task-desc-input" rows="3" placeholder="Add task details or notes..."></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="task-status-input">Status</label>
                        <select id="task-status-input">
                            <option value="PENDING">Pending</option>
                            <option value="IN_PROGRESS">In Progress</option>
                            <option value="COMPLETED">Completed</option>
                            <option value="CANCELLED">Cancelled</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="task-priority-input">Priority</label>
                        <select id="task-priority-input">
                            <option value="LOW">Low</option>
                            <option value="MEDIUM" selected>Medium</option>
                            <option value="HIGH">High</option>
                            <option value="URGENT">Urgent</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="task-date-input">Due Date</label>
                    <input type="date" id="task-date-input">
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn-primary">Save Task</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = '/api/tasks';
        let allTasks = [];

        document.addEventListener('DOMContentLoaded', () => {
            fetchTasks();
        });

        async function fetchTasks() {
            const search = document.getElementById('search-input').value;
            const status = document.getElementById('status-filter').value;
            const priority = document.getElementById('priority-filter').value;

            const params = new URLSearchParams();
            if (search) params.append('search', search);
            if (status) params.append('status', status);
            if (priority) params.append('priority', priority);

            try {
                const res = await fetch(`${API_URL}?${params.toString()}`);
                if (!res.ok) throw new Error('Failed to fetch tasks');
                allTasks = await res.json();
                renderTasks(allTasks);
                updateStats(allTasks);
            } catch (err) {
                console.error(err);
                document.getElementById('task-container').innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-triangle-exclamation"></i>
                        <h3>Error Loading Tasks</h3>
                        <p>${err.message}</p>
                    </div>
                `;
            }
        }

        function renderTasks(tasks) {
            const container = document.getElementById('task-container');
            if (tasks.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-clipboard-list"></i>
                        <h3>No Tasks Found</h3>
                        <p>Create a new task to get started!</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = tasks.map(task => {
                const statusClass = `badge-${(task.status || 'PENDING').toLowerCase()}`;
                const priorityColor = getPriorityColor(task.priority);

                return `
                    <div class="task-card">
                        <div class="task-header">
                            <span class="task-title">${escapeHtml(task.title || 'Untitled')}</span>
                            <span class="badge ${statusClass}">${task.status || 'PENDING'}</span>
                        </div>
                        <p class="task-desc">${escapeHtml(task.description || 'No description provided.')}</p>
                        
                        <div class="task-meta">
                            <div>
                                <span class="priority-dot" style="background: ${priorityColor}"></span>
                                <span>${task.priority || 'MEDIUM'} Priority</span>
                            </div>
                            <div class="task-actions">
                                <button class="btn-icon" title="Toggle Complete" onclick="toggleTaskStatus(${task.id}, '${task.status}')">
                                    <i class="fa-solid ${task.status === 'COMPLETED' ? 'fa-rotate-left' : 'fa-check'}"></i>
                                </button>
                                <button class="btn-icon" title="Edit Task" onclick="editTask(${task.id})">
                                    <i class="fa-solid fa-pen"></i>
                                </button>
                                <button class="btn-icon delete" title="Delete Task" onclick="deleteTask(${task.id})">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateStats(tasks) {
            document.getElementById('stat-total').innerText = tasks.length;
            document.getElementById('stat-pending').innerText = tasks.filter(t => t.status === 'PENDING').length;
            document.getElementById('stat-progress').innerText = tasks.filter(t => t.status === 'IN_PROGRESS').length;
            document.getElementById('stat-completed').innerText = tasks.filter(t => t.status === 'COMPLETED').length;
        }

        function getPriorityColor(priority) {
            switch ((priority || '').toUpperCase()) {
                case 'LOW': return 'var(--priority-low)';
                case 'HIGH': return 'var(--priority-high)';
                case 'URGENT': return 'var(--priority-urgent)';
                default: return 'var(--priority-medium)';
            }
        }

        function openModal(isEdit = false) {
            document.getElementById('modal-title').innerText = isEdit ? 'Edit Task' : 'Create New Task';
            if (!isEdit) {
                document.getElementById('task-form').reset();
                document.getElementById('task-id').value = '';
            }
            document.getElementById('modal-backdrop').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal-backdrop').classList.remove('active');
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('task-id').value;
            const payload = {
                title: document.getElementById('task-title-input').value,
                description: document.getElementById('task-desc-input').value,
                status: document.getElementById('task-status-input').value,
                priority: document.getElementById('task-priority-input').value,
                dueDate: document.getElementById('task-date-input').value || null
            };

            try {
                const method = id ? 'PUT' : 'POST';
                const url = id ? `${API_URL}/${id}` : API_URL;

                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) throw new Error('Failed to save task');
                closeModal();
                fetchTasks();
            } catch (err) {
                alert(err.message);
            }
        }

        async function editTask(id) {
            const task = allTasks.find(t => t.id === id);
            if (!task) return;

            document.getElementById('task-id').value = task.id;
            document.getElementById('task-title-input').value = task.title || '';
            document.getElementById('task-desc-input').value = task.description || '';
            document.getElementById('task-status-input').value = task.status || 'PENDING';
            document.getElementById('task-priority-input').value = task.priority || 'MEDIUM';
            document.getElementById('task-date-input').value = task.dueDate || '';

            openModal(true);
        }

        async function toggleTaskStatus(id, currentStatus) {
            const nextStatus = currentStatus === 'COMPLETED' ? 'PENDING' : 'COMPLETED';
            try {
                const res = await fetch(`${API_URL}/${id}/status`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: nextStatus })
                });

                if (!res.ok) throw new Error('Failed to update task status');
                fetchTasks();
            } catch (err) {
                alert(err.message);
            }
        }

        async function deleteTask(id) {
            if (!confirm('Are you sure you want to delete this task?')) return;
            try {
                const res = await fetch(`${API_URL}/${id}`, {
                    method: 'DELETE'
                });

                if (!res.ok) throw new Error('Failed to delete task');
                fetchTasks();
            } catch (err) {
                alert(err.message);
            }
        }

        function escapeHtml(str) {
            return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }
    </script>
</body>
</html>
